<div class="login-wrapper valign-wrapper">
    <div class="row center">
        <div class="row center" style=padding-top:20px>
            <h1 class=game-title>地牢探险</h1>
        </div>
        <div class=input-field style=padding-top:-50px;margin:0>
            <input id=input_user_name type=text>
            <label id=input_label_user_name for=input_user_name style=background-color:transparent!important>输入你的昵称</label>
        </div>
        <label id=label_error class=red-text>
            发生错误！
        </label>
        <span class="grey-text darken-3" style=font-size:13px>选择你的职业。<br>之后也可以在游戏中切换职业。</span>
        <div class="row center">
            <div id=icons_container style=margin-left:8px class=items-container-x></div>
        </div>
        <div class=row>
            <button id=button_join class="btn-large purple darken-2 s12">加入</button>
        </div>
    </div>
</div>
<div id=item_description_popup class="item-description-popup grey-text text-lighten-4"></div>
